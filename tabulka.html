<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabulka extraligy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.cdnfonts.com/css/telegraf" rel="stylesheet">
    <style>
        body {
            font-family: 'Telegraf', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            background: white;
        }
        .soutez-tab {
            transition: all 0.2s;
            cursor: pointer;
        }
        .soutez-tab.active {
            background: #2563eb;
            color: white;
        }
        .view-toggle {
            display: inline-flex;
            background: linear-gradient(135deg, #fecaca, #fecdd3);
            border: 2px solid #d93831;
            border-radius: 10px;
            padding: 3px;
            gap: 2px;
        }
        .view-toggle-btn {
            padding: 6px 16px;
            border-radius: 7px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #991b1b;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: transparent;
        }
        .view-toggle-btn:hover {
            color: #7f1d1d;
            background: rgba(255,255,255,0.4);
        }
        .view-toggle-btn.active {
            background: white;
            color: #d93831;
            box-shadow: 0 2px 6px rgba(217,56,49,0.3);
        }

        /* Bracket layout */
        .bracket-wrapper {
            display: flex;
            align-items: stretch;
            overflow-x: auto;
            padding: 16px 0;
            gap: 0;
        }
        .bracket-round {
            display: flex;
            flex-direction: column;
            min-width: 200px;
            flex-shrink: 0;
        }
        .bracket-round-title {
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6b7280;
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 2px solid #e5e7eb;
            margin-bottom: 0;
        }
        .bracket-matches {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            flex: 1;
            padding: 8px 0;
        }
        .bracket-match-slot {
            display: flex;
            align-items: center;
            flex: 1;
        }
        .bracket-match-slot .playoff-match {
            width: 100%;
            margin: 4px 0;
        }
        .bracket-connector-col {
            width: 32px;
            min-width: 32px;
            position: relative;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        /* Match cards */
        .playoff-match {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 8px 10px;
            transition: box-shadow 0.2s;
        }
        .playoff-match:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .playoff-match-label {
            font-size: 0.6rem;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }
        .playoff-match-teams {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .playoff-vs {
            text-align: center;
            font-size: 0.6rem;
            font-weight: 700;
            color: #9ca3af;
            padding: 1px 0;
        }
        .playoff-team {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 6px;
            border-radius: 5px;
            background: white;
            border: 1px solid #e5e7eb;
        }
        .playoff-team-green {
            background: #f0fdf4;
            border-color: #86efac;
        }
        .playoff-team-blue {
            background: #eff6ff;
            border-color: #93c5fd;
        }
        .playoff-team-east {
            background: #fefce8;
            border-color: #fbbf24;
        }
        .playoff-team-west {
            background: #eff6ff;
            border-color: #60a5fa;
        }
        .playoff-team-pending {
            background: #f3f4f6;
            border: 1px dashed #d1d5db;
        }
        .playoff-seed {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e5e7eb;
            font-size: 0.6rem;
            font-weight: 700;
            color: #374151;
            flex-shrink: 0;
        }
        .playoff-team-green .playoff-seed {
            background: #bbf7d0;
            color: #166534;
        }
        .playoff-team-blue .playoff-seed {
            background: #bfdbfe;
            color: #1e40af;
        }
        .playoff-team-east .playoff-seed {
            background: #fde68a;
            color: #92400e;
        }
        .playoff-team-west .playoff-seed {
            background: #bfdbfe;
            color: #1e40af;
        }
        .playoff-conf-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 3px;
            font-size: 0.55rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .playoff-conf-V {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fbbf24;
        }
        .playoff-conf-Z {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #60a5fa;
        }
        .playoff-team-name {
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playoff-series-score {
            margin-left: auto;
            font-size: 0.75rem;
            font-weight: 700;
            color: #374151;
            min-width: 16px;
            text-align: center;
        }
        .playoff-series-result {
            text-align: center;
            font-size: 0.6rem;
            font-weight: 600;
            color: #6b7280;
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px dashed #e5e7eb;
        }
        .playoff-champion {
            background: linear-gradient(135deg, #fefce8, #fef9c3);
            border: 2px solid #facc15;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-top: 8px;
        }
        .playoff-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .playoff-zz-badge {
            display: inline-block;
            margin-left: 5px;
            padding: 1px 4px;
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 3px;
            font-size: 0.55rem;
            font-weight: 700;
            color: #92400e;
            vertical-align: middle;
        }
        .playoff-placement-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 2px dashed #e5e7eb;
        }
        .playoff-placement-title {
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6b7280;
            margin-bottom: 10px;
        }
        .playoff-placement-matches {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .playoff-match-placement {
            min-width: 200px;
            flex: 1;
            max-width: 300px;
        }
        .playoff-team-placement-5 {
            background: #f0fdf4;
            border-color: #86efac;
        }
        .playoff-team-placement-7 {
            background: #fafafa;
            border-color: #d1d5db;
        }
        .playoff-team-placement-5 .playoff-seed,
        .playoff-team-placement-7 .playoff-seed {
            background: #e5e7eb;
            color: #374151;
            font-size: 0.55rem;
        }
        .playoff-placement-result {
            margin-top: 5px;
            padding-top: 5px;
            border-top: 1px dashed #e5e7eb;
            font-size: 0.6rem;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .placement-5 { color: #16a34a; font-weight: 600; }
        .placement-7 { color: #6b7280; }

        /* Responsive bracket */
        @media (max-width: 768px) {
            .bracket-wrapper {
                flex-direction: column;
                align-items: stretch;
            }
            .bracket-round {
                min-width: 0;
            }
            .bracket-matches {
                gap: 8px;
            }
            .bracket-connector-col {
                width: auto;
                min-width: auto;
                flex-direction: row;
                padding: 4px 0;
                justify-content: center;
                min-height: 30px;
            }
            .bracket-connector-col::after {
                content: '↓';
                font-size: 1.2rem;
                color: #d1d5db;
                font-weight: 700;
            }
            .view-toggle-btn {
                padding: 5px 12px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="max-w-6xl mx-auto">
        <!-- Výběr soutěže -->
        <div class="mb-4 flex flex-wrap items-center gap-2">
            <button onclick="zmenitSoutez('extraliga')" id="tab-extraliga" class="soutez-tab px-4 py-2 rounded-lg font-semibold text-sm bg-blue-600 text-white">
                🏆 Extraliga
            </button>
            <button onclick="zmenitSoutez('prvni-liga-vychod')" id="tab-prvni-liga-vychod" class="soutez-tab px-4 py-2 rounded-lg font-semibold bg-gray-200 text-gray-700 text-sm">
                🥈 1. liga - Východ
            </button>
            <button onclick="zmenitSoutez('prvni-liga-zapad')" id="tab-prvni-liga-zapad" class="soutez-tab px-4 py-2 rounded-lg font-semibold bg-gray-200 text-gray-700 text-sm">
                🥈 1. liga - Západ
            </button>
            <div class="ml-auto">
                <div class="view-toggle" id="viewToggle">
                    <button class="view-toggle-btn active" id="btnZakladni" onclick="prepnoutPohled('zakladni')">Základní část</button>
                    <button class="view-toggle-btn" id="btnPlayoff" onclick="prepnoutPohled('playoff')">Play-off</button>
                </div>
            </div>
        </div>

        <!-- Tabulka (základní část) -->
        <div id="tabulkaView" class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="text-white" style="background-color:#ed1c24">
                            <th class="text-center p-2 font-semibold">#</th>
                            <th class="text-left p-2 font-semibold">Tým</th>
                            <th class="text-center p-2 font-semibold">U</th>
                            <th class="text-center p-2 font-semibold">V</th>
                            <th class="text-center p-2 font-semibold">R</th>
                            <th class="text-center p-2 font-semibold">P</th>
                            <th class="text-center p-2 font-semibold">Zápasy</th>
                            <th class="text-center p-2 font-semibold">Sety</th>
                            <th class="text-center p-2 font-semibold">Body</th>
                            <th class="text-center p-2 font-semibold font-bold">Bodů</th>
                        </tr>
                    </thead>
                    <tbody id="tabulkaBody"></tbody>
                </table>
            </div>
            <div class="p-3 text-xs text-gray-600 bg-gray-50" id="bodovaniInfo"></div>
        </div>

        <!-- Play-off pohled -->
        <div id="playoffView" style="display: none;"></div>

        <div class="mt-3 text-xs text-gray-500 text-center">
            <a href="https://itsjakubmazur.github.io/cbasextraliga/" target="_blank" class="text-blue-600 hover:underline">
                Zobrazit kompletní statistiky →
            </a>
        </div>
    </div>

    <script>
        let zapasy = {};
        let aktualni_soutez = 'extraliga';
        let aktualni_pohled = 'zakladni';

        async function nacistData() {
            try {
                const response = await fetch('badminton-data.json');
                const data = await response.json();
                zapasy = data.zapasy;
                zobrazitTabulku();
            } catch (error) {
                console.error('Chyba načítání:', error);
                document.getElementById('tabulkaBody').innerHTML =
                    '<tr><td colspan="10" class="p-4 text-center text-red-600">Nepodařilo se načíst data</td></tr>';
            }
        }

        function zmenitSoutez(soutez) {
            aktualni_soutez = soutez;
            document.querySelectorAll('.soutez-tab').forEach(tab => {
                tab.classList.remove('active', 'bg-blue-600', 'text-white');
                tab.classList.add('bg-gray-200', 'text-gray-700');
            });
            document.getElementById('tab-' + soutez).classList.add('active', 'bg-blue-600', 'text-white');
            document.getElementById('tab-' + soutez).classList.remove('bg-gray-200', 'text-gray-700');
            if (aktualni_pohled === 'zakladni') {
                zobrazitTabulku();
            } else {
                zobrazitPlayoff();
            }
        }

        function prepnoutPohled(pohled) {
            aktualni_pohled = pohled;
            document.getElementById('btnZakladni').classList.toggle('active', pohled === 'zakladni');
            document.getElementById('btnPlayoff').classList.toggle('active', pohled === 'playoff');
            if (pohled === 'zakladni') {
                document.getElementById('tabulkaView').style.display = 'block';
                document.getElementById('playoffView').style.display = 'none';
                zobrazitTabulku();
            } else {
                document.getElementById('tabulkaView').style.display = 'none';
                document.getElementById('playoffView').style.display = 'block';
                zobrazitPlayoff();
            }
        }

        function parseVysledek(vysledek) {
            const parts = vysledek.split(':');
            return { domaci: parseInt(parts[0]) || 0, hoste: parseInt(parts[1]) || 0 };
        }

        function parseSety(sety) {
            if (!sety) return { domaciBody: 0, hosteBody: 0 };
            const setArr = sety.split(',').map(s => s.trim());
            let domaciBody = 0, hosteBody = 0;
            setArr.forEach(set => {
                const parts = set.split(':');
                domaciBody += parseInt(parts[0]) || 0;
                hosteBody += parseInt(parts[1]) || 0;
            });
            return { domaciBody, hosteBody };
        }

        function isPlayoffKolo(kolo) {
            if (!kolo) return false;
            const k = kolo.replace(/\.$/, '').trim().toUpperCase();
            return ['QF', 'SF', 'F', 'P5'].includes(k);
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function zobrazitTabulku() {
            const tabulka = {};
            const utkani = {};
            const jePrvniLiga = aktualni_soutez.includes('prvni-liga');

            (zapasy[aktualni_soutez] || []).forEach(zapas => {
                if (isPlayoffKolo(zapas.kolo)) return;
                const klic = zapas.kolo + '-' + zapas.tymDomaci + '-' + zapas.tymHoste;
                if (!utkani[klic]) utkani[klic] = {
                    kolo: zapas.kolo, domaci: zapas.tymDomaci, hoste: zapas.tymHoste, zapasy: []
                };
                utkani[klic].zapasy.push(zapas);
            });

            Object.values(utkani).forEach(utk => {
                const domaci = utk.domaci;
                const hoste = utk.hoste;
                if (!domaci || !hoste) return;

                if (!tabulka[domaci]) tabulka[domaci] = {
                    utkani: 0, vyhry: 0, remizy: 0, prohry: 0,
                    zapasyV: 0, zapasyP: 0, setyV: 0, setyP: 0, bodyV: 0, bodyP: 0, body: 0
                };
                if (!tabulka[hoste]) tabulka[hoste] = {
                    utkani: 0, vyhry: 0, remizy: 0, prohry: 0,
                    zapasyV: 0, zapasyP: 0, setyV: 0, setyP: 0, bodyV: 0, bodyP: 0, body: 0
                };

                let dz = 0, hz = 0, ds = 0, hs = 0, db = 0, hb = 0;
                utk.zapasy.forEach(z => {
                    const v = parseVysledek(z.vysledek);
                    const bd = parseSety(z.sety);
                    if (v.domaci > v.hoste) dz++; else hz++;
                    ds += v.domaci; hs += v.hoste;
                    db += bd.domaciBody; hb += bd.hosteBody;
                });

                let dbt = 0, hbt = 0;
                if (jePrvniLiga) {
                    if (dz === hz) { dbt = 2; hbt = 2; tabulka[domaci].remizy++; tabulka[hoste].remizy++; }
                    else if (dz > hz) { dbt = 3; hbt = 1; tabulka[domaci].vyhry++; tabulka[hoste].prohry++; }
                    else { hbt = 3; dbt = 1; tabulka[hoste].vyhry++; tabulka[domaci].prohry++; }
                } else {
                    if (dz > hz) {
                        if (dz >= 6) { dbt = 3; hbt = 0; }
                        else if (dz >= 4) { dbt = 2; hbt = 1; }
                        tabulka[domaci].vyhry++; tabulka[hoste].prohry++;
                    } else {
                        if (hz >= 6) { hbt = 3; dbt = 0; }
                        else if (hz >= 4) { hbt = 2; dbt = 1; }
                        tabulka[hoste].vyhry++; tabulka[domaci].prohry++;
                    }
                }

                tabulka[domaci].utkani++; tabulka[domaci].zapasyV += dz; tabulka[domaci].zapasyP += hz;
                tabulka[domaci].setyV += ds; tabulka[domaci].setyP += hs;
                tabulka[domaci].bodyV += db; tabulka[domaci].bodyP += hb; tabulka[domaci].body += dbt;
                tabulka[hoste].utkani++; tabulka[hoste].zapasyV += hz; tabulka[hoste].zapasyP += dz;
                tabulka[hoste].setyV += hs; tabulka[hoste].setyP += ds;
                tabulka[hoste].bodyV += hb; tabulka[hoste].bodyP += db; tabulka[hoste].body += hbt;
            });

            const tymy = Object.keys(tabulka);
            tymy.sort((a, b) => {
                const tA = tabulka[a], tB = tabulka[b];
                if (tB.body !== tA.body) return tB.body - tA.body;
                if (tB.vyhry !== tA.vyhry) return tB.vyhry - tA.vyhry;
                const rza = tA.zapasyV - tA.zapasyP, rzb = tB.zapasyV - tB.zapasyP;
                if (rzb !== rza) return rzb - rza;
                const rsa = tA.setyV - tA.setyP, rsb = tB.setyV - tB.setyP;
                if (rsb !== rsa) return rsb - rsa;
                return (tB.bodyV - tB.bodyP) - (tA.bodyV - tA.bodyP);
            });

            const rows = tymy.map((tym, idx) => {
                const t = tabulka[tym];
                const rz = t.zapasyV - t.zapasyP, rs = t.setyV - t.setyP, rb = t.bodyV - t.bodyP;
                let pc = '';
                if (jePrvniLiga) {
                    if (idx <= 3) pc = 'bg-green-100 font-semibold';
                    else if (idx === 8) pc = 'bg-red-50';
                } else {
                    if (idx <= 1) pc = 'bg-green-100 font-semibold';
                    else if (idx >= 2 && idx <= 5) pc = 'bg-blue-100';
                    else if (idx === 7) pc = 'bg-red-50';
                }
                const sz = rz > 0 ? '↗' : (rz < 0 ? '↘' : '→');
                const ss = rs > 0 ? '↗' : (rs < 0 ? '↘' : '→');
                const sb = rb > 0 ? '↗' : (rb < 0 ? '↘' : '→');
                return '<tr class="border-b hover:bg-gray-50">' +
                    '<td class="p-2 text-center font-bold ' + pc + '">' + (idx + 1) + '.</td>' +
                    '<td class="p-2 font-semibold ' + pc + '">' + escapeHtml(tym) + '</td>' +
                    '<td class="p-2 text-center">' + t.utkani + '</td>' +
                    '<td class="p-2 text-center text-green-600 font-semibold">' + t.vyhry + '</td>' +
                    '<td class="p-2 text-center text-yellow-600 font-semibold">' + t.remizy + '</td>' +
                    '<td class="p-2 text-center text-red-600 font-semibold">' + t.prohry + '</td>' +
                    '<td class="p-2 text-center text-xs">' + t.zapasyV + ':' + t.zapasyP + ' <span class="' + (rz >= 0 ? 'text-green-600' : 'text-red-600') + '">' + sz + (rz >= 0 ? '+' : '') + rz + '</span></td>' +
                    '<td class="p-2 text-center text-xs">' + t.setyV + ':' + t.setyP + ' <span class="' + (rs >= 0 ? 'text-green-600' : 'text-red-600') + '">' + ss + (rs >= 0 ? '+' : '') + rs + '</span></td>' +
                    '<td class="p-2 text-center text-xs">' + t.bodyV + ':' + t.bodyP + ' <span class="' + (rb >= 0 ? 'text-green-600' : 'text-red-600') + '">' + sb + (rb >= 0 ? '+' : '') + rb + '</span></td>' +
                    '<td class="p-2 text-center font-bold text-lg text-blue-700">' + t.body + '</td></tr>';
            }).join('');

            document.getElementById('tabulkaBody').innerHTML = rows;
            const legenda = jePrvniLiga
                ? '<div class="flex flex-wrap gap-3 mb-2"><span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded bg-green-100 border border-green-300"></span> 1.–4. Play-off</span><span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded bg-red-50 border border-red-200"></span> 9. Kvalifikace o 1. ligu</span></div>'
                : '<div class="flex flex-wrap gap-3 mb-2"><span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded bg-green-100 border border-green-300"></span> 1.–2. Přímý postup do Final Four</span><span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded bg-blue-100 border border-blue-300"></span> 3.–6. Čtvrtfinále</span><span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded bg-red-50 border border-red-200"></span> 8. Baráž</span></div>';
            const bodovani = jePrvniLiga
                ? '<strong>Bodování 1. ligy:</strong> Výhra = 3 body, Remíza = 2 body, Prohra = 1 bod'
                : '<strong>Bodování extraligy:</strong> Výhra 7:0,6:1 = 3 body | Výhra 5:2,4:3 = 2 body | Prohra 3:4,2:5 = 1 bod | Prohra 1:6,0:7 = 0 bodů';
            document.getElementById('bodovaniInfo').innerHTML = legenda + bodovani;
        }

        function getPlayoffResults(soutez) {
            const zap = zapasy[soutez] || [];
            const results = {};
            zap.forEach(z => {
                if (!isPlayoffKolo(z.kolo)) return;
                const kolo = z.kolo.replace(/\.$/, '').trim().toUpperCase();
                const klic = kolo + '-' + [z.tymDomaci, z.tymHoste].sort().join('-');
                if (!results[klic]) {
                    results[klic] = { kolo: kolo, tym1: z.tymDomaci, tym2: z.tymHoste, zapasy: [] };
                }
                results[klic].zapasy.push(z);
            });
            Object.values(results).forEach(r => {
                let v1 = 0, v2 = 0, odehranoHer = 0;
                r.zapasy.forEach(z => {
                    const v = parseVysledek(z.vysledek);
                    if (v.domaci === 0 && v.hoste === 0) return;
                    odehranoHer++;
                    if (z.tymDomaci === r.tym1) {
                        if (v.domaci > v.hoste) v1++; else v2++;
                    } else {
                        if (v.hoste > v.domaci) v1++; else v2++;
                    }
                });
                r.skore1 = v1; r.skore2 = v2;
                const remiza44 = v1 === 4 && v2 === 4 && odehranoHer >= 8;
                const rozhodnutZZ = odehranoHer >= 9 && ((v1 === 5 && v2 === 4) || (v2 === 5 && v1 === 4));
                r.zlatyZapas = remiza44 || rozhodnutZZ;
                r.vitez = v1 > v2 ? r.tym1 : (v2 > v1 ? r.tym2 : null);
                r.porazeny = r.vitez ? (r.vitez === r.tym1 ? r.tym2 : r.tym1) : null;
            });
            return results;
        }

        function findResult(results, kolo, tym1, tym2) {
            if (!tym1 || !tym2) return null;
            return results[kolo + '-' + [tym1, tym2].sort().join('-')] || null;
        }

        function seraditTymy(soutez) {
            const tabulka = {};
            const utkani = {};
            (zapasy[soutez] || []).forEach(zapas => {
                if (isPlayoffKolo(zapas.kolo)) return;
                const klic = zapas.kolo + '-' + zapas.tymDomaci + '-' + zapas.tymHoste;
                if (!utkani[klic]) utkani[klic] = { domaci: zapas.tymDomaci, hoste: zapas.tymHoste, zapasy: [] };
                utkani[klic].zapasy.push(zapas);
            });
            Object.values(utkani).forEach(utk => {
                const d = utk.domaci, h = utk.hoste;
                if (!d || !h) return;
                if (!tabulka[d]) tabulka[d] = { vyhry: 0, zapasyV: 0, zapasyP: 0, setyV: 0, setyP: 0, bodyV: 0, bodyP: 0, body: 0 };
                if (!tabulka[h]) tabulka[h] = { vyhry: 0, zapasyV: 0, zapasyP: 0, setyV: 0, setyP: 0, bodyV: 0, bodyP: 0, body: 0 };
                let dz = 0, hz = 0, ds = 0, hs = 0, db = 0, hb = 0;
                utk.zapasy.forEach(z => {
                    const v = parseVysledek(z.vysledek); const bd = parseSety(z.sety);
                    if (v.domaci > v.hoste) dz++; else hz++;
                    ds += v.domaci; hs += v.hoste; db += bd.domaciBody; hb += bd.hosteBody;
                });
                const jePL = soutez.includes('prvni-liga');
                let dbt = 0, hbt = 0;
                if (jePL) {
                    if (dz === hz) { dbt = 2; hbt = 2; }
                    else if (dz > hz) { dbt = 3; hbt = 1; tabulka[d].vyhry++; }
                    else { hbt = 3; dbt = 1; tabulka[h].vyhry++; }
                } else {
                    if (dz > hz) { dbt = dz >= 6 ? 3 : 2; hbt = dz >= 6 ? 0 : 1; tabulka[d].vyhry++; }
                    else { hbt = hz >= 6 ? 3 : 2; dbt = hz >= 6 ? 0 : 1; tabulka[h].vyhry++; }
                }
                tabulka[d].zapasyV += dz; tabulka[d].zapasyP += hz; tabulka[d].setyV += ds; tabulka[d].setyP += hs;
                tabulka[d].bodyV += db; tabulka[d].bodyP += hb; tabulka[d].body += dbt;
                tabulka[h].zapasyV += hz; tabulka[h].zapasyP += dz; tabulka[h].setyV += hs; tabulka[h].setyP += ds;
                tabulka[h].bodyV += hb; tabulka[h].bodyP += db; tabulka[h].body += hbt;
            });
            return Object.keys(tabulka).sort((a, b) => {
                const tA = tabulka[a], tB = tabulka[b];
                if (tB.body !== tA.body) return tB.body - tA.body;
                if (tB.vyhry !== tA.vyhry) return tB.vyhry - tA.vyhry;
                return (tB.zapasyV - tB.zapasyP) - (tA.zapasyV - tA.zapasyP);
            });
        }

        // Bracket rendering helpers (matching the main page's playoff.js)
        function teamCard(name, seed, highlight, conference, seriesScore) {
            const cls = highlight || '';
            const confBadge = conference
                ? '<span class="playoff-conf-badge playoff-conf-' + conference + '">' + (conference === 'V' ? 'V' : 'Z') + '</span>'
                : '';
            const scoreHtml = seriesScore !== undefined
                ? '<span class="playoff-series-score">' + seriesScore + '</span>'
                : '';
            return '<div class="playoff-team ' + cls + '">' +
                '<span class="playoff-seed">' + seed + '</span>' +
                confBadge +
                '<span class="playoff-team-name">' + escapeHtml(name) + '</span>' +
                scoreHtml +
                '</div>';
        }

        function pendingCard(label) {
            return '<div class="playoff-team playoff-team-pending">' +
                '<span class="playoff-seed">?</span>' +
                '<span class="playoff-team-name">' + label + '</span>' +
                '</div>';
        }

        function matchBox(team1Html, team2Html, label, seriesResult, result) {
            let resultHtml = '';
            if (seriesResult) {
                const zzBadge = result && result.zlatyZapas
                    ? '<span class="playoff-zz-badge" title="Zlatý zápas">ZZ</span>'
                    : '';
                resultHtml = '<div class="playoff-series-result">' + seriesResult + zzBadge + '</div>';
            }
            return '<div class="playoff-match">' +
                (label ? '<div class="playoff-match-label">' + label + '</div>' : '') +
                '<div class="playoff-match-teams">' +
                team1Html +
                '<div class="playoff-vs">vs</div>' +
                team2Html +
                '</div>' +
                resultHtml +
                '</div>';
        }

        function zobrazitPlayoff() {
            const container = document.getElementById('playoffView');
            const jePrvniLiga = aktualni_soutez.includes('prvni-liga');

            if (jePrvniLiga) {
                zobrazitPlayoffPrvniLiga(container);
            } else {
                zobrazitPlayoffExtraliga(container);
            }

            drawConnectors();
        }

        function zobrazitPlayoffExtraliga(container) {
            const tymy = seraditTymy('extraliga');
            const res = getPlayoffResults('extraliga');

            if (tymy.length < 6) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">Nedostatek týmů pro zobrazení play-off.</p>';
                return;
            }

            const t = (i) => tymy[i] || '?';

            // QF results
            const qfRes1 = findResult(res, 'QF', t(2), t(5));
            const qfRes2 = findResult(res, 'QF', t(3), t(4));
            const qfVitez1 = qfRes1 ? qfRes1.vitez : null;
            const qfVitez2 = qfRes2 ? qfRes2.vitez : null;

            const qf1 = matchBox(
                teamCard(t(2), '3.', qfVitez1 === t(2) ? 'playoff-team-green' : 'playoff-team-blue', null, qfRes1 ? (qfRes1.tym1 === t(2) ? qfRes1.skore1 : qfRes1.skore2) : undefined),
                teamCard(t(5), '6.', qfVitez1 === t(5) ? 'playoff-team-green' : 'playoff-team-blue', null, qfRes1 ? (qfRes1.tym1 === t(5) ? qfRes1.skore1 : qfRes1.skore2) : undefined),
                'Čtvrtfinále 1',
                qfRes1 ? qfRes1.skore1 + ':' + qfRes1.skore2 : null,
                qfRes1
            );
            const qf2 = matchBox(
                teamCard(t(3), '4.', qfVitez2 === t(3) ? 'playoff-team-green' : 'playoff-team-blue', null, qfRes2 ? (qfRes2.tym1 === t(3) ? qfRes2.skore1 : qfRes2.skore2) : undefined),
                teamCard(t(4), '5.', qfVitez2 === t(4) ? 'playoff-team-green' : 'playoff-team-blue', null, qfRes2 ? (qfRes2.tym1 === t(4) ? qfRes2.skore1 : qfRes2.skore2) : undefined),
                'Čtvrtfinále 2',
                qfRes2 ? qfRes2.skore1 + ':' + qfRes2.skore2 : null,
                qfRes2
            );

            // SF - reseeding based on regular season standings
            let sfTym1B = null;
            let sfTym2B = null;

            if (qfVitez1 && qfVitez2) {
                const seed1 = tymy.indexOf(qfVitez1);
                const seed2 = tymy.indexOf(qfVitez2);
                if (seed1 > seed2) {
                    sfTym1B = qfVitez1;
                    sfTym2B = qfVitez2;
                } else {
                    sfTym1B = qfVitez2;
                    sfTym2B = qfVitez1;
                }
            } else if (qfVitez1) {
                const sfCheck = findResult(res, 'SF', t(0), qfVitez1);
                if (sfCheck) { sfTym1B = qfVitez1; }
                else {
                    const sfCheck2 = findResult(res, 'SF', t(1), qfVitez1);
                    if (sfCheck2) { sfTym2B = qfVitez1; }
                }
            } else if (qfVitez2) {
                const sfCheck = findResult(res, 'SF', t(0), qfVitez2);
                if (sfCheck) { sfTym1B = qfVitez2; }
                else {
                    const sfCheck2 = findResult(res, 'SF', t(1), qfVitez2);
                    if (sfCheck2) { sfTym2B = qfVitez2; }
                }
            }

            const sfTym1A = t(0);
            const sfTym2A = t(1);

            const sfRes1 = sfTym1B ? findResult(res, 'SF', sfTym1A, sfTym1B) : null;
            const sfRes2 = sfTym2B ? findResult(res, 'SF', sfTym2A, sfTym2B) : null;
            const sfVitez1 = sfRes1 ? sfRes1.vitez : null;
            const sfVitez2 = sfRes2 ? sfRes2.vitez : null;

            const sf1 = matchBox(
                teamCard(sfTym1A, '1.', sfVitez1 === sfTym1A ? 'playoff-team-green' : 'playoff-team-green', null, sfRes1 ? (sfRes1.tym1 === sfTym1A ? sfRes1.skore1 : sfRes1.skore2) : undefined),
                sfTym1B
                    ? teamCard(sfTym1B, 'QF', sfVitez1 === sfTym1B ? 'playoff-team-green' : 'playoff-team-blue', null, sfRes1 ? (sfRes1.tym1 === sfTym1B ? sfRes1.skore1 : sfRes1.skore2) : undefined)
                    : pendingCard('Níže nasazený z ČF'),
                'Semifinále 1',
                sfRes1 ? sfRes1.skore1 + ':' + sfRes1.skore2 : null,
                sfRes1
            );
            const sf2 = matchBox(
                teamCard(sfTym2A, '2.', sfVitez2 === sfTym2A ? 'playoff-team-green' : 'playoff-team-green', null, sfRes2 ? (sfRes2.tym1 === sfTym2A ? sfRes2.skore1 : sfRes2.skore2) : undefined),
                sfTym2B
                    ? teamCard(sfTym2B, 'QF', sfVitez2 === sfTym2B ? 'playoff-team-green' : 'playoff-team-blue', null, sfRes2 ? (sfRes2.tym1 === sfTym2B ? sfRes2.skore1 : sfRes2.skore2) : undefined)
                    : pendingCard('Výše nasazený z ČF'),
                'Semifinále 2',
                sfRes2 ? sfRes2.skore1 + ':' + sfRes2.skore2 : null,
                sfRes2
            );

            // Final
            const fTym1 = sfVitez1 || null;
            const fTym2 = sfVitez2 || null;
            const fRes = (fTym1 && fTym2) ? findResult(res, 'F', fTym1, fTym2) : null;

            const final_ = matchBox(
                fTym1
                    ? teamCard(fTym1, 'SF', fRes && fRes.vitez === fTym1 ? 'playoff-team-green' : 'playoff-team-blue', null, fRes ? (fRes.tym1 === fTym1 ? fRes.skore1 : fRes.skore2) : undefined)
                    : pendingCard('Vítěz SF 1'),
                fTym2
                    ? teamCard(fTym2, 'SF', fRes && fRes.vitez === fTym2 ? 'playoff-team-green' : 'playoff-team-blue', null, fRes ? (fRes.tym1 === fTym2 ? fRes.skore1 : fRes.skore2) : undefined)
                    : pendingCard('Vítěz SF 2'),
                'Finále (Final Four)',
                fRes ? fRes.skore1 + ':' + fRes.skore2 : null,
                fRes
            );

            const champion = fRes ? fRes.vitez : null;
            const championHtml = champion
                ? '<div class="playoff-champion"><div class="text-xl">🏆</div><div class="font-bold text-yellow-800">' + escapeHtml(champion) + '</div></div>'
                : '';

            container.innerHTML =
                '<div class="bracket-wrapper">' +
                    '<div class="bracket-round bracket-round-qf">' +
                        '<div class="bracket-round-title">Čtvrtfinále</div>' +
                        '<div class="bracket-matches">' +
                            '<div class="bracket-match-slot">' + qf1 + '</div>' +
                            '<div class="bracket-match-slot">' + qf2 + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="bracket-connector-col"></div>' +
                    '<div class="bracket-round bracket-round-sf">' +
                        '<div class="bracket-round-title">Semifinále (Final Four)</div>' +
                        '<div class="bracket-matches">' +
                            '<div class="bracket-match-slot">' + sf1 + '</div>' +
                            '<div class="bracket-match-slot">' + sf2 + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="bracket-connector-col"></div>' +
                    '<div class="bracket-round bracket-round-f">' +
                        '<div class="bracket-round-title">Finále</div>' +
                        '<div class="bracket-matches">' +
                            '<div class="bracket-match-slot">' + final_ + '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>' +
                championHtml +
                '<div class="playoff-legend mt-3">' +
                    '<span class="inline-flex items-center gap-1 text-xs"><span class="w-3 h-3 rounded bg-green-100 border border-green-300"></span> Přímý postup do Final Four (1.–2.)</span>' +
                    '<span class="inline-flex items-center gap-1 text-xs ml-3"><span class="w-3 h-3 rounded bg-blue-100 border border-blue-300"></span> Čtvrtfinále (3.–6.)</span>' +
                '</div>' +
                '<p class="text-xs text-gray-500 mt-2">* Pavouk na základě pořadí v základní části. V SF hraje 1. tým proti níže nasazenému z ČF, 2. tým proti výše nasazenému.</p>';
        }

        function zobrazitPlayoffPrvniLiga(container) {
            const tymyV = seraditTymy('prvni-liga-vychod');
            const tymyZ = seraditTymy('prvni-liga-zapad');
            const res = getPlayoffResults('prvni-liga-playoff');

            if (tymyV.length < 4 || tymyZ.length < 4) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">Nedostatek týmů pro zobrazení play-off.</p>';
                return;
            }

            const qfPairs = [
                { v: 0, z: 3, label: 'Čtvrtfinále 1' },
                { v: 2, z: 1, label: 'Čtvrtfinále 2' },
                { v: 1, z: 2, label: 'Čtvrtfinále 3' },
                { v: 3, z: 0, label: 'Čtvrtfinále 4' }
            ];

            const qfResults = [];
            const qfBoxes = qfPairs.map((pair) => {
                const teamV = tymyV[pair.v];
                const teamZ = tymyZ[pair.z];
                const qfRes = findResult(res, 'QF', teamV, teamZ);
                qfResults.push(qfRes);
                const vitez = qfRes ? qfRes.vitez : null;

                return matchBox(
                    teamCard(teamV, (pair.v + 1) + '.', vitez === teamV ? 'playoff-team-green' : 'playoff-team-east', 'V', qfRes ? (qfRes.tym1 === teamV ? qfRes.skore1 : qfRes.skore2) : undefined),
                    teamCard(teamZ, (pair.z + 1) + '.', vitez === teamZ ? 'playoff-team-green' : 'playoff-team-west', 'Z', qfRes ? (qfRes.tym1 === teamZ ? qfRes.skore1 : qfRes.skore2) : undefined),
                    pair.label,
                    qfRes ? qfRes.skore1 + ':' + qfRes.skore2 : null,
                    qfRes
                );
            });

            // SF
            const sfTym1A = qfResults[0] ? qfResults[0].vitez : null;
            const sfTym1B = qfResults[1] ? qfResults[1].vitez : null;
            const sfTym2A = qfResults[2] ? qfResults[2].vitez : null;
            const sfTym2B = qfResults[3] ? qfResults[3].vitez : null;

            const sfRes1 = (sfTym1A && sfTym1B) ? findResult(res, 'SF', sfTym1A, sfTym1B) : null;
            const sfRes2 = (sfTym2A && sfTym2B) ? findResult(res, 'SF', sfTym2A, sfTym2B) : null;

            const sf1 = matchBox(
                sfTym1A
                    ? teamCard(sfTym1A, 'QF', sfRes1 && sfRes1.vitez === sfTym1A ? 'playoff-team-green' : 'playoff-team-blue', null, sfRes1 ? (sfRes1.tym1 === sfTym1A ? sfRes1.skore1 : sfRes1.skore2) : undefined)
                    : pendingCard('Vítěz ČF 1'),
                sfTym1B
                    ? teamCard(sfTym1B, 'QF', sfRes1 && sfRes1.vitez === sfTym1B ? 'playoff-team-green' : 'playoff-team-blue', null, sfRes1 ? (sfRes1.tym1 === sfTym1B ? sfRes1.skore1 : sfRes1.skore2) : undefined)
                    : pendingCard('Vítěz ČF 2'),
                'Semifinále 1',
                sfRes1 ? sfRes1.skore1 + ':' + sfRes1.skore2 : null,
                sfRes1
            );
            const sf2 = matchBox(
                sfTym2A
                    ? teamCard(sfTym2A, 'QF', sfRes2 && sfRes2.vitez === sfTym2A ? 'playoff-team-green' : 'playoff-team-blue', null, sfRes2 ? (sfRes2.tym1 === sfTym2A ? sfRes2.skore1 : sfRes2.skore2) : undefined)
                    : pendingCard('Vítěz ČF 3'),
                sfTym2B
                    ? teamCard(sfTym2B, 'QF', sfRes2 && sfRes2.vitez === sfTym2B ? 'playoff-team-green' : 'playoff-team-blue', null, sfRes2 ? (sfRes2.tym1 === sfTym2B ? sfRes2.skore1 : sfRes2.skore2) : undefined)
                    : pendingCard('Vítěz ČF 4'),
                'Semifinále 2',
                sfRes2 ? sfRes2.skore1 + ':' + sfRes2.skore2 : null,
                sfRes2
            );

            // Final
            const fTym1 = sfRes1 ? sfRes1.vitez : null;
            const fTym2 = sfRes2 ? sfRes2.vitez : null;
            const fRes = (fTym1 && fTym2) ? findResult(res, 'F', fTym1, fTym2) : null;

            const final_ = matchBox(
                fTym1
                    ? teamCard(fTym1, 'SF', fRes && fRes.vitez === fTym1 ? 'playoff-team-green' : 'playoff-team-blue', null, fRes ? (fRes.tym1 === fTym1 ? fRes.skore1 : fRes.skore2) : undefined)
                    : pendingCard('Vítěz SF 1'),
                fTym2
                    ? teamCard(fTym2, 'SF', fRes && fRes.vitez === fTym2 ? 'playoff-team-green' : 'playoff-team-blue', null, fRes ? (fRes.tym1 === fTym2 ? fRes.skore1 : fRes.skore2) : undefined)
                    : pendingCard('Vítěz SF 2'),
                'Finále',
                fRes ? fRes.skore1 + ':' + fRes.skore2 : null,
                fRes
            );

            const champion = fRes ? fRes.vitez : null;
            const championHtml = champion
                ? '<div class="playoff-champion"><div class="text-xl">🏆</div><div class="font-bold text-yellow-800">' + escapeHtml(champion) + '</div></div>'
                : '';

            // Placement matches (O 5./7. místo) – kolo P5
            const p5T1A = qfResults[0] ? qfResults[0].porazeny : null;
            const p5T1B = qfResults[1] ? qfResults[1].porazeny : null;
            const p5T2A = qfResults[2] ? qfResults[2].porazeny : null;
            const p5T2B = qfResults[3] ? qfResults[3].porazeny : null;
            const p5Res1 = (p5T1A && p5T1B) ? findResult(res, 'P5', p5T1A, p5T1B) : null;
            const p5Res2 = (p5T2A && p5T2B) ? findResult(res, 'P5', p5T2A, p5T2B) : null;
            const placementHtml = renderPlacementMatches(p5T1A, p5T1B, p5Res1, p5T2A, p5T2B, p5Res2);

            container.innerHTML =
                '<div class="bracket-wrapper">' +
                    '<div class="bracket-round bracket-round-qf">' +
                        '<div class="bracket-round-title">Čtvrtfinále</div>' +
                        '<div class="bracket-matches">' +
                            '<div class="bracket-match-slot">' + qfBoxes[0] + '</div>' +
                            '<div class="bracket-match-slot">' + qfBoxes[1] + '</div>' +
                            '<div class="bracket-match-slot">' + qfBoxes[2] + '</div>' +
                            '<div class="bracket-match-slot">' + qfBoxes[3] + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="bracket-connector-col"></div>' +
                    '<div class="bracket-round bracket-round-sf">' +
                        '<div class="bracket-round-title">Semifinále</div>' +
                        '<div class="bracket-matches">' +
                            '<div class="bracket-match-slot">' + sf1 + '</div>' +
                            '<div class="bracket-match-slot">' + sf2 + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="bracket-connector-col"></div>' +
                    '<div class="bracket-round bracket-round-f">' +
                        '<div class="bracket-round-title">Finále</div>' +
                        '<div class="bracket-matches">' +
                            '<div class="bracket-match-slot">' + final_ + '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>' +
                championHtml +
                placementHtml +
                '<div class="playoff-legend mt-3">' +
                    '<span class="inline-flex items-center gap-1 text-xs"><span class="w-3 h-3 rounded-sm border" style="background:#fef3c7;border-color:#fbbf24;width:12px;height:12px"></span> Východ</span>' +
                    '<span class="inline-flex items-center gap-1 text-xs ml-3"><span class="w-3 h-3 rounded-sm border" style="background:#dbeafe;border-color:#60a5fa;width:12px;height:12px"></span> Západ</span>' +
                '</div>' +
                '<p class="text-xs text-gray-500 mt-2">* Křížové nasazení Východ vs Západ.</p>';
        }

        function renderPlacementMatches(t1A, t1B, res1, t2A, t2B, res2) {
            if (!t1A && !t1B && !t2A && !t2B) return '';

            function makeCard(tym, result, isWinner) {
                if (!tym) return pendingCard('Poražený z ČF');
                const cls = isWinner ? 'playoff-team-placement-5' : 'playoff-team-placement-7';
                return '<div class="playoff-team ' + cls + '">' +
                    '<span class="playoff-seed">P</span>' +
                    '<span class="playoff-team-name">' + escapeHtml(tym) + '</span>' +
                    (result ? '<span class="playoff-series-score">' + (result.tym1 === tym ? result.skore1 : result.skore2) + '</span>' : '') +
                    '</div>';
            }

            function makeMatch(tA, tB, res, label) {
                const vitez = res ? res.vitez : null;
                const porazeny = res ? res.porazeny : null;
                const zzBadge = res && res.zlatyZapas ? '<span class="playoff-zz-badge">ZZ</span>' : '';
                const resultHtml = res
                    ? '<div class="playoff-series-result">' + res.skore1 + ':' + res.skore2 + zzBadge + '</div>'
                    : '';
                const placementResult = vitez
                    ? '<div class="playoff-placement-result"><span class="placement-5">🥈 ' + escapeHtml(vitez) + ' – 5. místo</span><span class="placement-7">' + escapeHtml(porazeny) + ' – 7. místo</span></div>'
                    : '';
                return '<div class="playoff-match playoff-match-placement">' +
                    '<div class="playoff-match-label">' + label + '</div>' +
                    '<div class="playoff-match-teams">' +
                    makeCard(tA, res, vitez === tA) +
                    '<div class="playoff-vs">vs</div>' +
                    makeCard(tB, res, vitez === tB) +
                    '</div>' +
                    resultHtml +
                    placementResult +
                    '</div>';
            }

            return '<div class="playoff-placement-section">' +
                '<div class="playoff-placement-title">Zápasy o umístění</div>' +
                '<div class="playoff-placement-matches">' +
                    makeMatch(t1A, t1B, res1, 'O 5. místo – utkání 1') +
                    makeMatch(t2A, t2B, res2, 'O 5. místo – utkání 2') +
                '</div>' +
                '<p style="font-size:0.7rem;color:#6b7280;margin-top:6px">Vítězové = dělené 5. místo, poražení = dělené 7. místo.</p>' +
            '</div>';
        }

        // SVG connector lines between bracket rounds
        function drawConnectors() {
            const wrapper = document.querySelector('.bracket-wrapper');
            if (!wrapper) return;

            requestAnimationFrame(function() {
                const connectorCols = wrapper.querySelectorAll('.bracket-connector-col');
                connectorCols.forEach(function(col) {
                    col.innerHTML = '';

                    const prevRound = col.previousElementSibling;
                    const nextRound = col.nextElementSibling;
                    if (!prevRound || !nextRound) return;

                    const prevSlots = prevRound.querySelectorAll('.bracket-match-slot');
                    const nextSlots = nextRound.querySelectorAll('.bracket-match-slot');
                    if (prevSlots.length === 0 || nextSlots.length === 0) return;

                    const colRect = col.getBoundingClientRect();
                    const colW = colRect.width;
                    const colH = colRect.height;

                    if (colW === 0 || colH === 0) return;

                    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.setAttribute('width', colW);
                    svg.setAttribute('height', colH);
                    svg.style.position = 'absolute';
                    svg.style.top = '0';
                    svg.style.left = '0';
                    svg.style.width = '100%';
                    svg.style.height = '100%';
                    svg.style.overflow = 'visible';

                    var strokeColor = '#d1d5db';

                    for (var i = 0; i < nextSlots.length; i++) {
                        var srcIdx1 = i * 2;
                        var srcIdx2 = i * 2 + 1;
                        if (srcIdx1 >= prevSlots.length) break;

                        var nextMatch = nextSlots[i].querySelector('.playoff-match');
                        var prevMatch1 = prevSlots[srcIdx1] ? prevSlots[srcIdx1].querySelector('.playoff-match') : null;
                        var prevMatch2 = prevSlots[srcIdx2] ? prevSlots[srcIdx2].querySelector('.playoff-match') : null;

                        if (!nextMatch || !prevMatch1) continue;

                        var nextCenter = getVerticalCenter(nextMatch, colRect);
                        var prev1Center = getVerticalCenter(prevMatch1, colRect);

                        drawLine(svg, 0, prev1Center, colW / 2, prev1Center, strokeColor);
                        drawLine(svg, colW / 2, prev1Center, colW / 2, nextCenter, strokeColor);
                        drawLine(svg, colW / 2, nextCenter, colW, nextCenter, strokeColor);

                        if (prevMatch2) {
                            var prev2Center = getVerticalCenter(prevMatch2, colRect);
                            drawLine(svg, 0, prev2Center, colW / 2, prev2Center, strokeColor);
                            drawLine(svg, colW / 2, prev2Center, colW / 2, nextCenter, strokeColor);
                        }
                    }

                    col.style.position = 'relative';
                    col.appendChild(svg);
                });
            });
        }

        function getVerticalCenter(el, refRect) {
            var rect = el.getBoundingClientRect();
            return (rect.top + rect.height / 2) - refRect.top;
        }

        function drawLine(svg, x1, y1, x2, y2, color) {
            var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('stroke', color);
            line.setAttribute('stroke-width', '2');
            svg.appendChild(line);
        }

        nacistData();
    </script>
</body>
</html>
