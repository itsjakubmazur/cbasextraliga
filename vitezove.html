<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Historie vítězů nejvyšší badmintonové ligy - Česká republika a Československo.">
    <meta name="theme-color" content="#D7141A">
    <title>Historie vítězů - Czech Badminton</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/icons.js"></script>
    <link href="https://fonts.cdnfonts.com/css/telegraf" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/standings.css">
</head>
<body>

    <header class="app-topbar">
        <div class="app-logo">
            <div class="app-logo-icon app-logo-icon-svg">
                <img src="css/BAD extraliga official.png" alt="Czech Badminton" style="display:block;height:38px;width:auto;max-height:38px">
            </div>
            <div>
                <span class="app-logo-text">Czech Badminton</span>
                <span class="app-logo-sub">Neoficiální ligové statistiky</span>
            </div>
        </div>
        <div class="app-topbar-right">
            <button onclick="toggleDarkMode()" class="app-icon-btn" id="darkModeBtn" title="Přepnout téma">
                <span id="darkModeIcon"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
            </button>
        </div>
    </header>

    <div class="app-layout">

        <aside class="app-sidebar">
            <div class="sidebar-section">
                <div class="sidebar-section-label">Navigace</div>
                <div class="sidebar-nav">
                    <a href="index.html" class="sidebar-nav-item sidebar-nav-link"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><circle cx="12" cy="20" r="2"/><path d="M12 18V9"/><path d="m8 5 4-3 4 3"/><path d="m6 8 6-2 6 2"/><path d="m7 11 5-1 5 1"/></svg> Ligové tabulky</a>
                    <a href="index.html#soupisky" class="sidebar-nav-item sidebar-nav-link"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Soupisky</a>
                    <span class="sidebar-nav-item active"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg> Historie vítězů</span>
                </div>
            </div>
        </aside>

        <main class="app-main">

            <div class="app-card">
                <div class="app-card-header">
                    <div>
                        <h2 class="app-card-title">Nejúspěšnější kluby</h2>
                        <div class="app-card-sub">Tituly mistra nejvyšší soutěže</div>
                    </div>
                </div>
                <table class="standings-table champions-table">
                    <thead><tr class="standings-thead"><th class="th-pos"><span class="sr-only">Pořadí</span></th><th class="th-name">Klub</th><th class="th-num lt-metric">Tituly</th></tr></thead>
                    <tbody id="topTymy"><tr><td colspan="3" class="stats-cell" style="color:var(--text2)">Načítání…</td></tr></tbody>
                </table>
            </div>

            <div class="app-card">
                <div class="app-card-header">
                    <div>
                        <h2 class="app-card-title">Mistři ligy</h2>
                        <div class="app-card-sub">Sezóny s odkazem mají na webu kompletní statistiky</div>
                    </div>
                </div>
                <table class="standings-table champions-table">
                    <tbody id="vitezoveList"></tbody>
                </table>
            </div>

        </main>
    </div>

    <script>
        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function deriveAktualniVitez(data) {
            const rocnik = data.rocnik;
            if (!rocnik) return null;
            if ((data.vitezove || []).some(v => v.sezona === rocnik)) return null;

            const zapasy = (data.zapasy && data.zapasy.extraliga) || [];
            const finaloveZapasy = zapasy.filter(z => {
                const k = (z.kolo || '').replace(/\.$/, '').trim().toUpperCase();
                return k === 'F';
            });
            if (finaloveZapasy.length === 0) return null;

            // Group into one series by team pair
            const serii = {};
            finaloveZapasy.forEach(z => {
                const klic = [z.tymDomaci, z.tymHoste].sort().join('§');
                if (!serii[klic]) serii[klic] = { tym1: z.tymDomaci, tym2: z.tymHoste, v1: 0, v2: 0 };
                const parts = (z.vysledek || '').split(':').map(Number);
                const dom = parts[0] || 0, host = parts[1] || 0;
                if (dom === 0 && host === 0) return; // neodehráno
                const s = serii[klic];
                if (z.tymDomaci === s.tym1) { if (dom > host) s.v1++; else if (host > dom) s.v2++; }
                else { if (host > dom) s.v1++; else if (dom > host) s.v2++; }
            });

            const serie = Object.values(serii)[0];
            if (!serie) return null;
            const vitez = serie.v1 > serie.v2 ? serie.tym1 : (serie.v2 > serie.v1 ? serie.tym2 : null);
            return vitez ? { sezona: rocnik, tym: vitez } : null;
        }

        async function init() {
            try {
                const response = await fetch('badminton-data.json');
                const data = await response.json();
                const historickeKlice = new Set(Object.keys(data.historicke_rocniky || {}));
                tymLoga = data.tymLoga || {};
                const vitezove = [...(data.vitezove || [])];
                const aktualni = deriveAktualniVitez(data);
                if (aktualni) vitezove.unshift(aktualni);
                render(vitezove, historickeKlice);
            } catch (e) {
                document.getElementById('topTymy').innerHTML = '<tr><td colspan="3" class="stats-cell" style="color:var(--loss)">Data se nepodařilo načíst. Zkuste stránku obnovit.</td></tr>';
            }

            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                document.getElementById('darkModeIcon').innerHTML = Icons.sun();
            }
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            document.getElementById('darkModeIcon').innerHTML = isDark ? Icons.sun() : Icons.moon();
        }

        let tymLoga = {};

        function logoHtml(tym) {
            const url = tymLoga[tym];
            return url
                ? '<span class="lt-logo"><img src="' + escapeHtml(url).replace(/"/g, '&quot;') + '" alt="" onerror="this.parentNode.classList.add(\'lt-logo-empty\');this.remove()"></span>'
                : '<span class="lt-logo lt-logo-empty">' + escapeHtml(String(tym).split(/\s+/).filter(w => !['sk','bk','tj','ba'].includes(w.toLowerCase())).slice(0, 2).map(w => w.charAt(0).toUpperCase()).join('')) + '</span>';
        }

        function render(vitezove, historickeKlice) {
            const sorted = [...vitezove].sort((a, b) => (parseInt(b.sezona) || 0) - (parseInt(a.sezona) || 0));
            const cr = sorted.filter(v => parseInt(v.sezona) >= 1992);
            const csr = sorted.filter(v => parseInt(v.sezona) < 1992);

            const tituly = {};
            sorted.forEach(v => {
                if (v.tym.toLowerCase().includes('nehráno')) return;
                tituly[v.tym] = (tituly[v.tym] || 0) + 1;
            });
            const topTymy = Object.entries(tituly).sort((a, b) => b[1] - a[1]).slice(0, 8);
            document.getElementById('topTymy').innerHTML = topTymy.map((t, i) =>
                '<tr class="stats-row"><td class="stats-cell stats-pos">' + (i + 1) + '.</td>' +
                '<td class="stats-cell stats-name"><span class="match-tym">' + logoHtml(t[0]) + escapeHtml(t[0]) + '</span></td>' +
                '<td class="stats-cell lt-metric">' + t[1] + '</td></tr>'
            ).join('');

            document.getElementById('vitezoveList').innerHTML =
                '<tr class="roster-group"><td colspan="2">Česká republika, od sezóny 1992/93</td></tr>' + renderList(cr, historickeKlice) +
                '<tr class="roster-group"><td colspan="2">Československo, do sezóny 1991/92</td></tr>' + renderList(csr, historickeKlice);
        }

        function renderList(items, historickeKlice) {
            if (items.length === 0) return '<tr><td colspan="2" class="stats-cell" style="color:var(--text2)">Žádná data.</td></tr>';
            return items.map((v, i) => {
                const nehrano = v.tym.toLowerCase().includes('nehráno');
                const klicDash = v.sezona.replace('/', '-');
                const klicSlash = v.sezona.replace('-', '/');
                const historickyKlic = historickeKlice.has(klicDash) ? klicDash
                    : historickeKlice.has(klicSlash) ? klicSlash : null;
                const seasonHtml = historickyKlic
                    ? '<a class="champions-season-link" href="index.html#' + historickyKlic + '/extraliga">' + escapeHtml(v.sezona) + '</a>'
                    : escapeHtml(v.sezona);
                return '<tr class="stats-row' + (nehrano ? ' roster-row-inactive' : '') + '">' +
                    '<td class="stats-cell champions-season">' + seasonHtml + '</td>' +
                    '<td class="stats-cell stats-name">' + (nehrano ? escapeHtml(v.tym) : '<span class="match-tym">' + logoHtml(v.tym) + escapeHtml(v.tym) + '</span>') + '</td>' +
                    '</tr>';
            }).join('');
        }

        init();
    </script>
</body>
</html>
